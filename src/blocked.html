<!DOCTYPE html>
<html lang="en">
<head>
  <title>Blocked — Beeyond Limits</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="fonts/fonts.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #9e1414;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .brutal-box {
      background: #ffffff;
      color: #0d0c0c;
      border: 4px solid #0d0c0c;
      box-shadow: 8px 8px 0px 0px #0d0c0c;
      padding: 3rem;
      max-width: 500px;
    }
    h1 {
      font-family: 'Anton', sans-serif;
      font-size: 5rem;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 1rem;
    }
    .domain-badge {
      border: 2px solid #0d0c0c;
      background: #eeba0b;
      padding: 0.5rem 1rem;
      font-family: monospace;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 1.2rem;
      display: inline-block;
      box-shadow: 4px 4px 0px 0px #0d0c0c;
      margin-bottom: 2rem;
    }
    .subtitle {
      font-family: monospace;
      font-size: 1rem;
      font-weight: bold;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="brutal-box">
    <h1>BLOCKED.</h1>
    <div class="domain-badge" id="blocked-domain">...</div>
    <p class="subtitle">GET BACK TO WORK.</p>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
